  html, body {
    margin: 0;
    height: 100%;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    font-family: "JetBrains Mono Local", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 500;
    color: #ffffff;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    white-space: pre;
  }
  .stage span { display: inline-block; min-width: 0.62em; }

<body>
<div class="stage" id="trail"></div>
<script>
  var CHARS = "0123456789&%$#@";
  var TEXT = "turbopuffer";
  var FLICKER_MS = 450;
  var RELEASE_MS = 2000;
  var STEP_MS = 80;
  var EMULATED_MOUSE_GUARD_MS = 1200;

  var container = document.getElementById("trail");
  var charEls = TEXT.split("").map(function (ch) {
    var span = document.createElement("span");
    span.textContent = ch;
    container.appendChild(span);
    return span;
  });

  var resolveAt = new Array(TEXT.length).fill(-Infinity);
  var hoverIndex = -1;
  var ignoreMouseUntil = -Infinity;
  var rafId = null;

  function randomChar() {
    return CHARS.charAt(Math.floor(Math.random() * CHARS.length));
  }

  function render() {
    var now = performance.now();
    var active = false;
    for (var i = 0; i < TEXT.length; i++) {
      if (i === hoverIndex || now < resolveAt[i]) {
        charEls[i].textContent = randomChar();
        active = true;
      } else {
        charEls[i].textContent = TEXT[i];
      }
    }
    rafId = active ? requestAnimationFrame(render) : null;
  }

  function ensureLoop() {
    if (rafId == null) rafId = requestAnimationFrame(render);
  }

  function indexFromX(clientX) {
    var rect = container.getBoundingClientRect();
    var charWidth = rect.width / TEXT.length;
    return Math.min(TEXT.length - 1, Math.max(0, Math.floor((clientX - rect.left) / charWidth)));
  }

  function staggerFrom(entryIndex, includeEntry) {
    var now = performance.now();
    var order = [];
    for (var i = 0; i < TEXT.length; i++) {
      if (includeEntry || i !== entryIndex) order.push(i);
    }
    order.sort(function (a, b) { return Math.abs(b - entryIndex) - Math.abs(a - entryIndex); });
    order.forEach(function (idx, rank) { resolveAt[idx] = now + (rank + 1) * STEP_MS; });
  }

  function rippleInto(entryIndex) {
    staggerFrom(entryIndex, false);
    hoverIndex = entryIndex;
    ensureLoop();
  }

  function moveHoverTo(idx) {
    if (idx === hoverIndex) return;
    var now = performance.now();
    var prev = hoverIndex === -1 ? idx : hoverIndex;
    var lo = Math.min(prev, idx), hi = Math.max(prev, idx);
    for (var i = lo; i <= hi; i++) {
      if (i !== idx) resolveAt[i] = now + FLICKER_MS;
    }
    hoverIndex = idx;
    ensureLoop();
  }

  function handleMove(clientX) {
    var idx = indexFromX(clientX);
    if (hoverIndex === -1) rippleInto(idx); else moveHoverTo(idx);
  }

  function releaseHover() {
    if (hoverIndex === -1) return;
    resolveAt[hoverIndex] = performance.now() + RELEASE_MS;
    hoverIndex = -1;
    ensureLoop();
  }

  function markTouchInput() {
    ignoreMouseUntil = performance.now() + EMULATED_MOUSE_GUARD_MS;
  }

  container.addEventListener("mouseenter", function (e) {
    if (performance.now() >= ignoreMouseUntil) rippleInto(indexFromX(e.clientX));
  });
  container.addEventListener("mousemove", function (e) {
    if (performance.now() >= ignoreMouseUntil) handleMove(e.clientX);
  });
  container.addEventListener("mouseleave", releaseHover);
  container.addEventListener("touchstart", function (e) {
    markTouchInput();
    if (e.touches[0]) rippleInto(indexFromX(e.touches[0].clientX));
  }, { passive: true });
  container.addEventListener("touchmove", function (e) {
    markTouchInput();
    if (e.touches[0]) handleMove(e.touches[0].clientX);
  }, { passive: true });
  container.addEventListener("touchend", function () {
    markTouchInput();
    releaseHover();
  });
  container.addEventListener("touchcancel", function () {
    markTouchInput();
    releaseHover();
  });

  staggerFrom(Math.floor(TEXT.length / 2), true);
  ensureLoop();
</script>
