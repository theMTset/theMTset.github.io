  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive star tetrahedron</title>

       hidden-line implementation are preserved; this portfolio mode lets the parent page scrub
       the opening formation, then hands the completed shape to ambient spin and direct orbit. -->

    :root { color-scheme: dark; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

      --bg: #020406;
      --thr-bg: #020406;
      --thr-gold: #fff;
    }

    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    /* Leave more breathing room around the geometry on desktop. The earlier -3rem overlap made
       the surrounding hero copy crowd the animation. */
    margin-top: -1.25rem;
    margin-bottom: -1.25rem;
  }
  /* The stage carries the sizing the canvas used to carry, so the canvas can simply fill it and
     the button can anchor to its corner. Size changes are driven by a FLIP transform in script
     rather than a width transition — transforms animate on the compositor, and the growth has to
     stay smooth on a phone while the renderer is still drawing every frame. */

    display: block;
    width: 100%;
    max-width: 300px;
    transform-origin: center center;
    will-change: transform;

    position: relative;
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
    background-color: transparent;
    z-index: 1;

     for it right now — worth pairing with a visible hint, since a captured scroll that
     nobody knows is captured reads as a broken page. */

       runs, and preventDefault arrives too late to stop it — the shape ignores the first drag
       and the page lurches instead. Scoped to .scroll-coupled so the canvas scrolls like
       ordinary page content until the animation has actually been started. */

     <video>, so requestFullscreen on a div silently does nothing there. An overlay behaves the
     same on every device, which matters more here than the browser chrome going away. */

    position: fixed;
    inset: 0;
    margin: 0;
    z-index: 9999;

     is absolutely positioned over the placeholder in the hero; expand/collapse can therefore
     change only styles and never detach or reattach the canvas on the landing frame. */

    position: absolute;
    inset: auto;
    margin: 0;
    z-index: 0;

     from the --bg used by the rest of the page — matching --bg was why the panel read as a
     wrong, blacker rectangle instead of the hero simply growing. */
  .tetra-backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--thr-bg, var(--bg, #0c0d11));
    opacity: 0;
    pointer-events: none;

    pointer-events: none;
  }

    place-items: center;
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    border: 0;
    border-radius: 0.5rem;

  .tetra-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .expanded .tetra-controls { right: 0.25rem; }
  .expanded .tetra-btn { opacity: 0.6; }

    height: 1.15rem;

  .tetra-icon-close,

  .tetra-btn-roll,

  .expanded .tetra-btn-roll,

    .tetra-btn { transition: none; }
    .tetra-backdrop { transition: none; }

  }

    .star-tetra-container { height: 100%; margin: 0; }
    .star-tetra-stage { width: min(100vw, 100vh); max-width: none; }
    .tetra-controls, .tetra-backdrop { display: none !important; }
    canvas { cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
